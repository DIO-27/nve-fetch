name: Fetch NVE from GoFile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests -q

      - name: Download from GoFile
        run: python scripts/gofile_dl.py

      - name: Split into <2GB parts
        run: |
          find out -type f ! -name 'SHA256SUMS.txt' -size +1900M \
            -exec split -b 1900m -d {} {}.part- \; \
            -exec rm {} \;
          ls -lahR out

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nve-fetch \
            --repo "$GITHUB_REPOSITORY" \
            --title "NVE package" \
            --notes "Split parts + SHA256SUMS.txt (original hashes). Concatenate with: cat *.part* > file"
          find out -type f -print0 | xargs -0 gh release upload nve-fetch \
            --repo "$GITHUB_REPOSITORY" --clobber
